<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Recetario Intercambiable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:opsz,wght@8..144,500;8..144,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F7F5F0;
  --surface:#FFFFFF;
  --surface-2:#F1EEE8;
  --surface-3:#E9E5DC;
  --ink:#1B1F1C;
  --ink-2:#585F59;
  --ink-3:#666D67;
  --line:#E4E0D7;
  --line-2:#D1CCC0;
  --brand:#1F4A38;
  --brand-hi:#2C6349;
  --brand-soft:#E6EDE8;
  --brand-ink:#14382A;
  --on-brand:#FFFFFF;
  --ok:#2E6A48;   --ok-bg:#E6F0E9;
  --warn:#8A6413; --warn-bg:#F6EEDA;
  --bad:#8E392D;  --bad-bg:#F5E5E1;
  --mk-des:#B8902A; --mk-alm:#1F4A38; --mk-cen:#5E6E93; --mk-gua:#7A6E4E;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r1:3px; --r2:6px; --r3:10px; --r4:16px;
  --sh1:0 1px 2px rgba(27,31,28,.05);
  --sh2:0 2px 4px rgba(27,31,28,.05), 0 12px 28px -18px rgba(27,31,28,.32);
  --sh3:0 8px 24px -8px rgba(27,31,28,.18), 0 32px 64px -32px rgba(27,31,28,.4);
  --f-ed:"Petrona",Georgia,serif;
  --f-ui:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-mo:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --maxw:1220px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111412; --surface:#181C19; --surface-2:#1F2420; --surface-3:#272D28;
    --ink:#ECE9E1; --ink-2:#B3BAB3; --ink-3:#8F968F;
    --line:#282E29; --line-2:#3A413B;
    --brand:#7FC3A2; --brand-hi:#9AD4B6; --brand-soft:#1A2B23; --brand-ink:#A9DCC2;
    --on-brand:#0E1A14;
    --ok:#76C398;   --ok-bg:#16261D;
    --warn:#D6B15E; --warn-bg:#292312;
    --bad:#DD8777;  --bad-bg:#2D1B17;
    --mk-des:#D7B45C; --mk-alm:#7FC3A2; --mk-cen:#8B9AC2; --mk-gua:#C2B68F; --mk-gua:#C2B68F;
    --sh1:0 1px 2px rgba(0,0,0,.4);
    --sh2:0 2px 4px rgba(0,0,0,.3), 0 12px 28px -18px rgba(0,0,0,.8);
    --sh3:0 8px 24px -8px rgba(0,0,0,.6), 0 32px 64px -32px rgba(0,0,0,1);
  }
}
:root[data-theme="dark"]{
  --bg:#111412; --surface:#181C19; --surface-2:#1F2420; --surface-3:#272D28;
  --ink:#ECE9E1; --ink-2:#B3BAB3; --ink-3:#8F968F;
  --line:#282E29; --line-2:#3A413B;
  --brand:#7FC3A2; --brand-hi:#9AD4B6; --brand-soft:#1A2B23; --brand-ink:#A9DCC2;
  --on-brand:#0E1A14;
  --ok:#76C398;   --ok-bg:#16261D;
  --warn:#D6B15E; --warn-bg:#292312;
  --bad:#DD8777;  --bad-bg:#2D1B17;
  --mk-des:#D7B45C; --mk-alm:#7FC3A2; --mk-cen:#8B9AC2; --mk-gua:#C2B68F;
  --sh1:0 1px 2px rgba(0,0,0,.4);
  --sh2:0 2px 4px rgba(0,0,0,.3), 0 12px 28px -18px rgba(0,0,0,.8);
  --sh3:0 8px 24px -8px rgba(0,0,0,.6), 0 32px 64px -32px rgba(0,0,0,1);
}

/* ============ BASE ============ */
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-ui); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:600; line-height:1.2; text-wrap:balance}
p{margin:0}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0; text-align:left}
a{color:var(--brand-ink); text-underline-offset:3px}
:focus-visible{outline:2.5px solid var(--brand); outline-offset:2px; border-radius:var(--r1)}
.dsel:focus-visible,.srch input:focus-visible,.field select:focus-visible{outline-offset:1px}
.num{font-variant-numeric:tabular-nums}

/* ============ SHELL ============ */
.top{position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--line)}
.top-in{max-width:var(--maxw); margin:0 auto; padding:var(--s3) var(--s5);
  display:flex; align-items:center; gap:var(--s5); flex-wrap:wrap}
.mark{display:flex; flex-direction:column; gap:1px; margin-right:auto}
.mark b{font-family:var(--f-ed); font-size:19px; font-weight:600; letter-spacing:-.01em}
.mark span{font-size:12px; color:var(--ink-3)}
.ctrls{display:flex; align-items:center; gap:var(--s4)}
.field{display:flex; align-items:center; gap:var(--s2); font-size:12.5px; color:var(--ink-2)}
.field select{border:1px solid var(--line-2); background:var(--surface); border-radius:var(--r2);
  padding:5px 8px; font-size:13px; font-variant-numeric:tabular-nums}
.sync{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2)}
.sync i{width:6px; height:6px; border-radius:50%; background:var(--ink-3); flex:none}
.sync i.on{background:var(--ok)} .sync i.wait{background:var(--warn)} .sync i.bad{background:var(--bad)} .sync i.loc{background:var(--ink-3)}
nav.main{max-width:var(--maxw); margin:0 auto; padding:0 var(--s5);
  display:flex; align-items:center; gap:var(--s1); overflow-x:auto; scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main button{padding:10px var(--s3) 12px; font-size:14px; font-weight:500; color:var(--ink-3);
  border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; transition:color .12s ease}
nav.main button:hover{color:var(--ink)}
nav.main button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--brand)}
nav.main .sep{flex:1}
nav.main button.sec{font-size:13px}
main{max-width:var(--maxw); margin:0 auto; padding:var(--s6) var(--s5) var(--s8)}
.page-h{margin-bottom:var(--s5)}
.page-h h1{font-family:var(--f-ed); font-size:30px; letter-spacing:-.015em}
.page-h .sub{color:var(--ink-3); font-size:14px; margin-top:2px}
.eyebrow{font-size:11.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}

/* ============ INICIO ============ */
.hoy-grid{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(300px,.9fr); gap:var(--s6); align-items:start}
@media (max-width:920px){ .hoy-grid{grid-template-columns:1fr; gap:var(--s5)} }
.meals{display:flex; flex-direction:column; gap:var(--s3)}
.meal{position:relative; background:var(--surface); border-radius:var(--r3); box-shadow:var(--sh1);
  padding:var(--s4) var(--s5); display:grid; grid-template-columns:100px minmax(0,1fr) auto;
  gap:var(--s4); align-items:center; transition:box-shadow .15s ease}
.meal::before{content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px;
  border-radius:0 3px 3px 0; background:var(--line-2)}
.meal.mk-desayuno::before{background:var(--mk-des)}
.meal.mk-almuerzo::before{background:var(--mk-alm)}
.meal.mk-cena::before{background:var(--mk-cen)}
.meal.mk-guarnicion::before{background:var(--mk-gua)}
.meal.mk-dulce::before{background:var(--mk-des); opacity:.55}
.meal.opc{border-style:dashed}
.meal.opc .slot-k b{color:var(--ink-2)}
.meal:hover{box-shadow:var(--sh2)}
.meal .slot-k{display:flex; flex-direction:column; gap:2px}
.meal .slot-k b{font-size:12.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase}
.meal .slot-k span{font-family:var(--f-mo); font-size:12px; color:var(--ink-3)}
.meal .body h3{font-family:var(--f-ed); font-size:20px; letter-spacing:-.01em}
.meal .body .meta{display:flex; flex-wrap:wrap; gap:4px var(--s3); margin-top:3px; font-size:13px; color:var(--ink-2)}
.meal .body .meta .nd{color:var(--ink-3); font-style:italic}
.meal .body .meta b{font-weight:600; font-variant-numeric:tabular-nums}
.meal .acts{display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap}
@media (max-width:700px){
  .meal{grid-template-columns:1fr; gap:var(--s3); padding:var(--s4)}
  .meal .acts{justify-content:flex-start}
}
.meal.vacio .body h3{color:var(--ink-3)}

.btn{display:inline-flex; align-items:center; gap:6px; border-radius:var(--r2); padding:7px 13px;
  font-size:13.5px; font-weight:500; white-space:nowrap; border:1px solid transparent;
  transition:background .12s ease, border-color .12s ease, color .12s ease}
.btn.pri{background:var(--brand); color:var(--on-brand); border-color:var(--brand)}
.btn.pri:hover{background:var(--brand-hi); border-color:var(--brand-hi)}
.btn.sec{border-color:var(--line-2); color:var(--ink)}
.btn.sec:hover{border-color:var(--ink-3); background:var(--surface-2)}
.btn.gh{color:var(--ink-2); padding:6px 9px}
.btn.gh:hover{color:var(--ink); background:var(--surface-2)}
.btn.sm{padding:5px 10px; font-size:12.5px}

.aside{display:flex; flex-direction:column; gap:var(--s5)}
.panel{background:var(--surface); border-radius:var(--r3); box-shadow:var(--sh1); padding:var(--s5)}
.panel > h3{font-size:14px; font-weight:600; margin-bottom:var(--s4);
  display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3)}
.panel > h3 em{font-style:normal; font-size:12px; color:var(--ink-3); font-weight:400; text-align:right}
.bars{display:flex; flex-direction:column; gap:var(--s4)}
.bar .lab{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3); margin-bottom:5px}
.bar .lab span{font-size:13px; color:var(--ink-2)}
.bar .lab b{font-family:var(--f-mo); font-size:13px; font-weight:500; font-variant-numeric:tabular-nums}
.bar .lab b i{font-style:normal; color:var(--ink-3)}
.track{height:6px; border-radius:99px; background:var(--surface-3); overflow:hidden; position:relative}
.fill{height:100%; border-radius:99px; background:var(--brand); transition:width .3s ease}
.fill.ok{background:var(--ok)} .fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)}
.track .goal{position:absolute; top:0; bottom:0; width:1.5px; background:var(--ink-3); opacity:.5}
.bar .note{font-size:12px; color:var(--ink-3); margin-top:4px; line-height:1.4}
.bar .note.est-warn{color:var(--warn)} .bar .note.est-bad{color:var(--bad)} .bar .note.est-ok{color:var(--ok)}
.bar .lab sup{font-size:10px; color:var(--warn); margin-left:1px}
.kv{display:flex; flex-direction:column; gap:var(--s3)}
.kv .row{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3); font-size:13.5px}
.kv .row span{color:var(--ink-2)}
.kv .row b{font-family:var(--f-mo); font-weight:500; font-variant-numeric:tabular-nums; text-align:right}

.alerts{display:flex; flex-direction:column; gap:var(--s2)}
.alert{display:flex; gap:var(--s3); align-items:flex-start; padding:10px var(--s3);
  border-radius:var(--r2); font-size:13.5px; line-height:1.45; border-left:3px solid transparent}
.alert.bad{background:var(--bad-bg); border-left-color:var(--bad)}
.alert.warn{background:var(--warn-bg); border-left-color:var(--warn)}
.alert.ok{background:var(--ok-bg); border-left-color:var(--ok)}
.alert .tag{font-size:11.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; flex:none; padding-top:2px}
.alert.bad .tag{color:var(--bad)} .alert.warn .tag{color:var(--warn)} .alert.ok .tag{color:var(--ok)}
.chiprow{display:flex; flex-wrap:wrap; gap:6px}
.chip-s{font-size:12px; padding:3px 9px; border-radius:99px; background:var(--surface-2);
  color:var(--ink-2); border:1px solid var(--line)}
.chip-s.ok{background:var(--ok-bg); color:var(--ok); border-color:transparent}
.chip-s.bad{background:var(--bad-bg); color:var(--bad); border-color:transparent}
.chip-s.brand{background:var(--brand-soft); color:var(--brand-ink); border-color:transparent}
.chip-s.warn{background:var(--warn-bg); color:var(--warn); border-color:transparent}
button.chip-s.link{cursor:pointer; text-decoration:underline; text-decoration-color:var(--line-2); text-underline-offset:2px}
button.chip-s.link:hover{border-color:var(--ink-3); color:var(--ink)}

/* ============ SEMANA ============ */
.wk{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:var(--s2)}
.day{background:var(--surface); border-radius:var(--r3); box-shadow:var(--sh1);
  display:flex; flex-direction:column; overflow:hidden}
.day.vent{background:var(--surface-2)}
.day.hoy{box-shadow:0 0 0 2px var(--brand), var(--sh1)}
.day-h{padding:10px var(--s3) 8px; display:flex; align-items:baseline; justify-content:space-between; gap:6px}
.day-h b{font-family:var(--f-ed); font-size:15.5px; font-weight:600}
.day-h .w{font-size:11.5px; color:var(--ink-3); text-align:right; line-height:1.3}
.dslot{padding:8px var(--s3); border-top:1px solid var(--line)}
.dslot .k{font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3)}
.dslot button.pick{display:block; width:100%; font-size:13px; line-height:1.3; margin-top:3px;
  padding:4px 5px; margin-left:-5px; border-radius:var(--r1); color:var(--ink)}
.dslot button.pick:hover{background:var(--surface-3)}
.dslot button.pick.err{color:var(--bad)}
.dslot button.pick.none{color:var(--ink-3)}
.dslot .mm{font-family:var(--f-mo); font-size:11.5px; color:var(--ink-3); margin-top:2px; line-height:1.4}
.dslot.opc{background:var(--surface-2)}
.dslot.opc .k{color:var(--mk-gua)}
.dslot .fuera{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; min-height:28px; color:var(--ink-2);
  margin-top:4px; cursor:pointer}
.day-t{margin-top:auto; padding:8px var(--s3) 10px; border-top:1px solid var(--line);
  display:flex; flex-direction:column; gap:2px}
.day-t .r{display:flex; justify-content:space-between; gap:6px; font-size:12.5px; color:var(--ink-2)}
.day-t .r b{font-family:var(--f-mo); font-weight:500; font-variant-numeric:tabular-nums; color:var(--ink)}
.day-t .r.warn b{color:var(--warn)} .day-t .r.bad b{color:var(--bad)}
.day-t .est{font-size:11.5px; color:var(--ink-3); line-height:1.35; margin-top:4px}
.c-bad{color:var(--bad)} .c-warn{color:var(--warn)}
.daysel{display:none; gap:var(--s1); overflow-x:auto; scrollbar-width:none; margin-bottom:var(--s4)}
.daysel::-webkit-scrollbar{display:none}
.daysel button{padding:7px 13px; border-radius:99px; font-size:13.5px; border:1px solid var(--line-2); color:var(--ink-2)}
.daysel button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.daysel button .dot{display:inline-block; width:5px; height:5px; border-radius:50%;
  background:var(--bad); margin-left:5px; vertical-align:middle}
@media (max-width:1040px){
  .daysel{display:flex}
  .wk{grid-template-columns:1fr}
  .day{display:none}
  .day.show{display:flex}
}

/* ============ RECETAS ============ */
.rec{display:grid; grid-template-columns:minmax(280px,340px) minmax(0,1fr); gap:var(--s6); align-items:start}
@media (max-width:940px){ .rec{grid-template-columns:1fr; gap:var(--s5)} }
.srch{position:relative; margin-bottom:var(--s3)}
.srch input{width:100%; padding:10px 12px 10px 34px; border-radius:var(--r2);
  border:1px solid var(--line-2); background:var(--surface); font-size:14.5px}
.srch svg{position:absolute; left:11px; top:11px; color:var(--ink-3)}
.seg{display:flex; background:var(--surface-2); border-radius:var(--r2); padding:3px; margin-bottom:var(--s3)}
.seg button{flex:1; padding:6px 4px; font-size:13px; border-radius:var(--r1); color:var(--ink-2); text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--sh1); font-weight:500}
details.filt{margin-bottom:var(--s3)}
details.filt summary{font-size:13px; color:var(--ink-2); cursor:pointer; padding:4px 0; list-style:none;
  display:flex; align-items:center; gap:6px}
details.filt summary::-webkit-details-marker{display:none}
details.filt summary::before{content:"\203A"; display:inline-block; transition:transform .15s ease; color:var(--ink-3)}
details.filt[open] summary::before{transform:rotate(90deg)}
.filtbody{display:flex; flex-direction:column; gap:var(--s2); padding:var(--s3) 0 0}
.filtbody label{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-2); cursor:pointer}
.filtbody input[type=checkbox]{accent-color:var(--brand); width:15px; height:15px}
.filtbody select{width:100%; padding:7px 9px; border-radius:var(--r2); border:1px solid var(--line-2);
  background:var(--surface); font-size:13.5px}
.reclist{display:flex; flex-direction:column; max-height:calc(100vh - 300px); overflow-y:auto;
  background:var(--surface); border-radius:var(--r3); box-shadow:var(--sh1); padding:var(--s2)}
@media (max-width:940px){ .reclist{max-height:420px} }
.reclist button{display:block; width:100%; padding:9px 11px; border-radius:var(--r2); transition:background .1s ease}
.reclist button:hover{background:var(--surface-2)}
.reclist button[aria-current="true"]{background:var(--brand-soft)}
.reclist .t{display:flex; align-items:baseline; gap:8px}
.reclist .t span{font-size:14px; line-height:1.3}
.reclist .m{display:block; font-family:var(--f-mo); font-size:12px; color:var(--ink-3); margin-top:2px; line-height:1.4}
.reclist .empty{padding:var(--s5) var(--s3); color:var(--ink-3); font-size:14px; text-align:center}

.ficha{background:var(--surface); border-radius:var(--r4); box-shadow:var(--sh2); overflow:hidden}
.ficha-h{padding:var(--s6) var(--s6) var(--s5)}
@media (max-width:640px){ .ficha-h{padding:var(--s5) var(--s4) var(--s4)} }
.ficha-h .line{display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; margin-bottom:var(--s2)}
.ficha-h h2{font-family:var(--f-ed); font-size:32px; letter-spacing:-.02em; line-height:1.12}
@media (max-width:640px){ .ficha-h h2{font-size:25px} }
.ficha-h .desc{color:var(--ink-2); max-width:60ch; margin-top:var(--s2); font-size:14.5px}
.nutstrip{display:flex; flex-wrap:wrap; gap:var(--s4) var(--s6); margin-top:var(--s5)}
.nutstrip div{display:flex; flex-direction:column; gap:1px}
.nutstrip .k{font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3)}
.nutstrip .v{font-family:var(--f-mo); font-size:19px; font-weight:500; font-variant-numeric:tabular-nums}
.ficha-b{padding:0 var(--s6) var(--s6); display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr);
  gap:var(--s6); align-items:start}
@media (max-width:860px){ .ficha-b{grid-template-columns:1fr; gap:var(--s5); padding:0 var(--s4) var(--s5)} }
.sec-t{font-size:11.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  padding-bottom:var(--s2); border-bottom:1px solid var(--line); margin-bottom:var(--s3)}
.ings{display:flex; flex-direction:column}
.ing{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--s4); align-items:baseline; padding:6px 0}
.ing + .ing{border-top:1px solid var(--line)}
.ing .n{font-size:14px}
.ing .q{text-align:right}
.ing .q b{font-family:var(--f-mo); font-size:13.5px; font-weight:500; font-variant-numeric:tabular-nums; white-space:nowrap}
.ing .q em{display:block; font-style:normal; font-family:var(--f-mo); font-size:12px; color:var(--ink-3); margin-top:1px}

    if(/curry en polvo casero/i.test(item)) return {item:'Especias para curry en polvo P5', cant:cant};
    if(/berbere casero/i.test(item)) return {item:'Especias para berbere P8', cant:cant};
    return {item:item, cant:cant};
  }
  /* Producto al que correspondía cada línea antigua; las mezclas de especias no tienen equivalente. */
  var MIGRA_EXTRA = {'Frejol blanco seco':'frejol_blanco', 'Frejol negro seco':'frejol_negro', 'Frejol rojo seco':'frejol_rojo',
    'Garbanzo seco':'garbanzo', 'Arroz integral seco':'arroz_integral', 'Haba seca cocida':'haba_seca', 'Queso fresco':'queso_fresco', 'Mozzarella':'mozzarella'};
  function productoAntiguo(item){
    if(MIGRA_EXTRA[item]) return MIGRA_EXTRA[item];
    var f = forma(item);
    return f && f.p ? f.p : null;
  }

  function plan(semIn, comensales){
    var sem = normalizarSemana(semIn), k = comensales || 1;
    var lineas = {}, demanda = {}, errores = [];
    function lineaDe(pid, unidad, estado){
      var clave = pid + '|' + (unidad || '') + '|' + (estado || '');
      if(!lineas[clave]){
        var pr = producto(pid) || {nombre:pid.replace(/^txt:/, ''), seccion:'Abarrotes'};
        lineas[clave] = {clave:clave, producto:pid, nombre:pr.nombre, seccion:pr.seccion, nota:pr.nota || '',
          unidad:unidad, estado:estado || '', cant:0, sinCantidad:false, origenes:[], limitaciones:[], notasForma:[]};
      }
      return lineas[clave];
    }
    function limitar(l, m){ if(l.limitaciones.indexOf(m) < 0) l.limitaciones.push(m); }
    /* Resuelve un ingrediente: a una línea de compra, a una exclusión o a la demanda de una preparación. */
    function resolver(ing, factor, org, pila){
      var f = forma(ing.item);
      if(!f){
        var lx = lineaDe('txt:' + ing.item, ing.unidad, '');
        limitar(lx, 'Ingrediente sin asignar en el catálogo de compras: se lista tal como aparece en la receta.');
        sumar(lx, ing, factor, org);
        return;
      }
      if(f.excluir) return;
      if(f.desde){
        if(!P[f.desde]){ errores.push('La forma «' + ing.item + '» apunta a la preparación ' + f.desde + ', que no existe.'); return; }
        if(pila.indexOf(f.desde) >= 0){ errores.push('Ciclo de preparaciones: ' + pila.concat(f.desde).join(' → ') + '.'); return; }
        var dm = demanda[f.desde] = demanda[f.desde] || {};
        var sl = dm[f.salida] = dm[f.salida] || {cant:0, unidad:ing.unidad, origenes:[]};
        if(sl.unidad !== ing.unidad) errores.push('Unidades incompatibles para ' + f.desde + ': ' + sl.unidad + ' y ' + ing.unidad + '.');
        var c = ing.cantidad * factor;
        sl.cant += c;
        sl.origenes.push(ext(org, {cant:c, item:ing.item}));
        return;
      }
      var l = lineaDe(f.p, ing.unidad, f.estado);
      if(f.nota && l.notasForma.indexOf(f.nota) < 0) l.notasForma.push(f.nota);
      sumar(l, ing, factor, ext(org, {corte:f.prep || ''}));
    }
    function sumar(l, ing, factor, org){
      if(ing.cantidad == null){
        l.sinCantidad = true;
        l.origenes.push(ext(org, {cant:null, item:ing.item, nota:ing.nota || 'cantidad no indicada'}));
        return;
      }
      var c = ing.cantidad * factor;
      l.cant += c;
      l.origenes.push(ext(org, {cant:c, item:ing.item}));
    }
    function ext(a, b){ var o = {}, x; for(x in a) o[x] = a[x]; for(x in b) o[x] = b[x]; return o; }

    /* 1. Platos y dulces del menú */
    platos(sem).forEach(function(pl){
      pl.receta.ingredientes.forEach(function(i){
        var ant = claveAntigua(i.item, i.cantidad * k);
        resolver(i, k, {dia:pl.dia, comida:pl.comida, receta:pl.receta.id, nombreReceta:pl.receta.nombre,
          antiguas: ant ? [{clave:ant.item + '||' + i.unidad, cant:ant.cant, producto:productoAntiguo(ant.item)}] : []}, []);
      });
      (pl.receta.requiere || []).forEach(function(pid){
        if(!P[pid]) errores.push(pl.receta.nombre + ' requiere la preparación ' + pid + ', que no existe.');
      });
    });
    DIAS.forEach(function(d){
      var du = DU[sem[d.k].dulce];
      if(!du || !du.ingredientes) return;
      du.ingredientes.forEach(function(i){
        resolver(i, k, {dia:d.k, comida:'dulce', receta:du.id, nombreReceta:du.nombre, antiguas:[]}, []);
      });
    });

    /* 2. Orden de las preparaciones: primero las que dependen de otras (P3 antes que P1). */
    var deps = {};
    Object.keys(P).forEach(function(pid){
      deps[pid] = [];
      (P[pid].ingredientes || []).forEach(function(i){
        var f = forma(i.item);
        if(f && f.desde && deps[pid].indexOf(f.desde) < 0) deps[pid].push(f.desde);
      });
    });
    var visto = {}, enCurso = {}, post = [], ciclos = {};
    function dfs(pid, camino){
      if(visto[pid]) return;
      if(enCurso[pid]){ ciclos[pid] = true; errores.push('Ciclo de preparaciones: ' + camino.concat(pid).join(' → ') + '.'); return; }
      enCurso[pid] = true;
      deps[pid].forEach(function(q){
        if(!P[q]){ errores.push('La preparación ' + pid + ' usa ' + q + ', que no existe.'); return; }
        dfs(q, camino.concat(pid));
      });
      enCurso[pid] = false; visto[pid] = true; post.push(pid);
    }
    Object.keys(P).sort().forEach(function(pid){ dfs(pid, []); });
    var orden = post.slice().reverse();

    /* 3. Cada preparación con demanda: cantidad necesaria, cantidad que se preparará y materias primas. */
    var preps = {};
    orden.forEach(function(pid){
      var dm = demanda[pid];
      if(!dm) return;
      var p = P[pid], mo = p.modelo || {}, out = {id:pid, nombre:p.nombre, tipo:mo.tipo || '', salidas:[], limitaciones:[], origenes:[]};
      preps[pid] = out;
      Object.keys(dm).forEach(function(sk){ dm[sk].origenes.forEach(function(o){ out.origenes.push(o); }); });
      if(ciclos[pid]){ out.limitaciones.push('No se calcula por un ciclo de dependencias.'); return; }
      if(mo.tipo === 'coccion'){
        var rd = mo.rendimiento;
        Object.keys(dm).forEach(function(sk){
          var need = dm[sk], sal = (mo.salidas || {})[sk];
          var fila = sal && sal.fila ? (p.tabla || []).filter(function(t){ return t.legumbre === sal.fila; })[0] : null;
          var o = {id:sk, nombre:sal ? sal.nombre : sk, necesario:need.cant, unidad:need.unidad, origenes:need.origenes, fila:fila || null};
          out.salidas.push(o);
          var pr = sal ? sal.producto : null;
          if(!sal || !rd || (sal.fila && !fila) || sal.fila === null || need.unidad !== 'g'){
            /* Sin rendimiento documentado: se compra en el mismo estado que pide la receta. */
            o.limitacion = (sal && sal.limitacion) || ('Sin rendimiento documentado para ' + o.nombre.toLowerCase() + '.');
            out.limitaciones.push(o.limitacion);
            var lc = lineaDe(pr || ('txt:' + o.nombre), need.unidad, 'cocida');
            limitar(lc, o.limitacion);
            need.origenes.forEach(function(og){ lc.cant += og.cant; lc.origenes.push(ext(og, {via:[pid]})); });
            return;
          }
          var seco = need.cant * rd.seco / rd.cocido;
          var prepSeco = redondeaArriba(seco, mo.redondeo_seco || 1);
          o.seco = seco; o.prepararSeco = prepSeco;
          o.prepararCocido = prepSeco * rd.cocido / rd.seco;
          o.excedente = o.prepararCocido - need.cant;
          o.agua = fila ? fila.agua_ml / fila.seca_g * prepSeco : (mo.agua_por_seco ? mo.agua_por_seco * prepSeco : null);
          o.base = fila ? {seco:fila.seca_g, agua:fila.agua_ml} : {seco:rd.seco, cocido:rd.cocido};
          o.verificado = !!rd.verificado;
          o.fuente = rd.fuente;
          var l = lineaDe(pr, 'g', '');
          if(!rd.verificado) limitar(l, 'Peso seco calculado con un factor sin verificar (' + String(rd.seco / rd.cocido).replace('.', ',') + ' g seco por g cocido).');
          /* Cada origen aporta su parte del seco; el redondeo del lote se anota aparte. */
          need.origenes.forEach(function(og){
            var parte = og.cant * rd.seco / rd.cocido;
            l.cant += parte;
            l.origenes.push(ext(og, {cant:parte, cocido:og.cant, via:[pid].concat(og.via || [])}));
          });
          if(prepSeco - seco > EPS){
            l.cant += prepSeco - seco;
            l.origenes.push({redondeo:true, cant:prepSeco - seco, via:[pid], antiguas:[{clave:null}]});
          }
          (mo.por_tanda || []).forEach(function(pt){
            var lt = lineaDe(forma(pt.item) ? forma(pt.item).p : 'txt:' + pt.item, pt.unidad, '');
            lt.cant += pt.cantidad;
            lt.origenes.push({prep:pid, cant:pt.cantidad, item:pt.item, via:[pid], paraSalida:o.nombre, antiguas:[]});
          });
        });
        return;
      }
      if(mo.tipo === 'lote'){
        var sks = Object.keys(dm), need = 0, uni = mo.unidad;
        sks.forEach(function(sk){
          if(dm[sk].unidad !== uni) errores.push('Unidades incompatibles para ' + pid + ': se pide en ' + dm[sk].unidad + ' y el lote es en ' + uni + '.');
          else need += dm[sk].cant;
        });
        var hecho = mo.entero ? redondeaArriba(need, mo.lote) : redondeaArriba(need, mo.paso || mo.lote);
        var factor = hecho / mo.lote;
        out.salidas.push({id:'lote', nombre:p.nombre, necesario:need, unidad:uni, preparar:hecho, excedente:hecho - need,
          lotes:mo.entero ? hecho / mo.lote : null, factor:factor, base:mo.lote, nota:mo.nota_lote || '', origenes:out.origenes});
        /* Las materias primas llevan el rastro de los platos que usan la preparación. */
        var antiguas = [];
        out.origenes.forEach(function(og){ (og.antiguas || []).forEach(function(a){ antiguas.push(a); }); });
        (p.ingredientes || []).forEach(function(i){
          resolver(i, factor, {prep:pid, nombreReceta:p.nombre, para:out.origenes, antiguas:antiguas}, [pid]);
        });
        return;
      }
      out.limitaciones.push('La preparación no tiene un modelo de cálculo; se muestra solo el texto.');
    });

    /* 4. Salida ordenada */
    var lista = Object.keys(lineas).map(function(c){ return lineas[c]; });
    lista.sort(function(a, b){ return a.nombre.localeCompare(b.nombre, 'es') || String(a.estado).localeCompare(String(b.estado), 'es'); });
    var necesarias = {};
    platos(sem).forEach(function(pl){ (pl.receta.requiere || []).forEach(function(pid){ necesarias[pid] = true; }); });
    Object.keys(preps).forEach(function(pid){ necesarias[pid] = true; });
    return {lineas:lista, porClave:lineas, preps:preps, necesarias:necesarias, errores:errores, orden:orden};
  }

  /* Recetas y días que usan una preparación, contando las que la usan a través de otra (D2 → P3 → P1). */
  function usosPrep(pl, pid){
    var pr = pl.preps[pid], out = [], v = {};
    if(!pr) return out;
    (function recorre(origs){
      origs.forEach(function(o){
        if(o.para) return recorre(o.para);
        if(!o.dia) return;
        var kk = o.dia + '|' + o.comida + '|' + o.receta;
        if(v[kk]) return;
        v[kk] = 1; out.push({dia:o.dia, comida:o.comida, receta:o.receta, nombre:o.nombreReceta});
      });
    })(pr.origenes);
    var ordenDia = {}; DIAS.forEach(function(d, i){ ordenDia[d.k] = i; });
    out.sort(function(a, b){ return ordenDia[a.dia] - ordenDia[b.dia]; });
    return out;
  }

  /* ---------- marcas de compra ---------- */
  /* Marca vigente: cubre la cantidad actual. Una marca guardada para menos cantidad queda parcial. */
  function estadoMarca(l, marcas){
    var mk = marcas[l.clave];
    if(!mk) return {s:'', parcial:false};
    if(typeof mk !== 'object') return {s:'c', parcial:false};
    if(!l.sinCantidad && typeof mk.q === 'number' && l.cant > mk.q + tolUnidad(l.unidad))
      return {s:mk.s, parcial:true, q:mk.q, falta:l.cant - mk.q};
    return {s:mk.s, parcial:false, q:mk.q};
  }
  function tolUnidad(u){ return u === 'g' || u === 'ml' ? 0.5 : 0.01; }

  /* Migra las marcas de la v2.3 (clave «ítem||unidad»). Solo se trasladan cuando todos los aportes de la línea
     nueva estaban marcados y corresponden al mismo producto; en otro caso la línea queda pendiente y la marca
     antigua se conserva como referencia. */
  function migrarMarcas(antiguas, sem, comensales){
    var nuevas = {}, pl = plan(sem, comensales);
    pl.lineas.forEach(function(l){
      var algun = false, falla = false, q = 0, usadas = [];
      l.origenes.forEach(function(o){
        if(o.redondeo) return;
        var util = (o.antiguas || []).filter(function(a){ return a.clave && a.producto === l.producto; });
        if(!util.length || !util.every(function(a){ return antiguas[a.clave]; })){ falla = true; return; }
        algun = true;
        /* Una misma marca antigua puede llegar por varios caminos: se cuenta una vez. */
        util.forEach(function(a){ if(usadas.indexOf(a) < 0){ usadas.push(a); q += a.cant; } });
      });
      if(algun && !falla) nuevas[l.clave] = {s:'c', q:q};
    });
    return nuevas;
  }
  function marcasAntiguasDe(l, antiguas){
    var out = [];
    l.origenes.forEach(function(o){
      (o.antiguas || []).forEach(function(a){
        if(a.clave && antiguas[a.clave] && out.indexOf(a.clave) < 0) out.push(a.clave);
      });
    });
    return out.map(function(c){ return c.split('||')[0]; });
  }

  /* ---------- estado guardado ---------- */
  function migrarEstado(o){
    var st = {v:VERSION_ESTADO, semana:null, comensales:1, compras:{}, comprasLegado:{}, prep:{}, fase:1};
    if(!o || typeof o !== 'object') return st;
    st.semana = o.semana ? normalizarSemana(o.semana) : null;
    var c = parseInt(o.comensales, 10);
    st.comensales = c >= 1 && c <= 12 ? c : 1;
    st.fase = o.fase === 2 ? 2 : 1;
    st.prep = (o.prep && typeof o.prep === 'object') ? o.prep : {};
    st.comprasLegado = (o.comprasLegado && typeof o.comprasLegado === 'object') ? o.comprasLegado : {};
    var compras = (o.compras && typeof o.compras === 'object') ? o.compras : {};
    if((o.v || 0) < 3){
      /* Marcas de la v2.3: se conservan como referencia y se trasladan solo las que corresponden sin ambigüedad. */
      var ant = {};
      Object.keys(compras).forEach(function(kk){ if(compras[kk]) ant[kk] = 1; });
      Object.keys(ant).forEach(function(kk){ st.comprasLegado[kk] = 1; });
      st.compras = st.semana ? migrarMarcas(ant, st.semana, st.comensales) : {};
    } else {
      Object.keys(compras).forEach(function(kk){
        var m = compras[kk];
        if(m && typeof m === 'object' && (m.s === 'c' || m.s === 't')) st.compras[kk] = {s:m.s, q:typeof m.q === 'number' ? m.q : null};
      });
    }
    return st;
  }

  /* ---------- preparaciones listas ---------- */
  function estadoPrep(pp, marca, semanaActual){
    if(!pp) return {s:'no', m:''};
    if(!marca || marca.semana !== semanaActual) return {s:'pend', antigua:marca ? marca.semana : null};
    var falta = [];
    pp.salidas.forEach(function(o){
      var cant = o.prepararSeco != null ? o.prepararSeco : (o.preparar != null ? o.preparar : o.necesario);
      var hecho = marca.q && typeof marca.q[o.id] === 'number' ? marca.q[o.id] : 0;
      if(cant > hecho + 0.5) falta.push({id:o.id, nombre:o.nombre, falta:cant - hecho, hecho:hecho, unidad:o.prepararSeco != null ? 'g seco' : o.unidad});
    });
    return falta.length ? {s:'parcial', falta:falta} : {s:'lista'};
  }
  function marcaPrep(pp, semanaActual){
    var q = {};
    pp.salidas.forEach(function(o){ q[o.id] = o.prepararSeco != null ? o.prepararSeco : (o.preparar != null ? o.preparar : o.necesario); });
    return {semana:semanaActual, q:q};
  }

  return {
    DIAS:DIAS, COMIDAS:COMIDAS, NOMBRE_COMIDA:NOMBRE_COMIDA, FUERA:FUERA, DULCE_ESTIMADO_KCAL:DULCE_ESTIMADO_KCAL,
    VERSION_ESTADO:VERSION_ESTADO, FASES:FASES, pendientesConfig:pendientesConfig,
    byId:byId, preps:P, dulces:DU, catalogo:CAT,
    diaDe:diaDe, vacio:vacio, copia:copia, semanaPrep:semanaPrep,
    objetivos:objetivos, evaluar:evaluar, umbrales:umbrales,
    normalizarSemana:normalizarSemana, platos:platos, usos:usos, usosDulce:usosDulce, omega:omega,
    cuentaRepeticion:cuentaRepeticion,
    totalesDia:totalesDia, evaluarDia:evaluarDia, problemasDia:problemasDia, problemasSemana:problemasSemana,
    tiempo:tiempo, textoTiempo:textoTiempo, fmtMin:fmtMin,
    filtrar:filtrar, seleccion:seleccion,
    plan:plan, usosPrep:usosPrep, estadoMarca:estadoMarca, migrarMarcas:migrarMarcas, marcasAntiguasDe:marcasAntiguasDe,
    claveAntigua:claveAntigua, migrarEstado:migrarEstado, estadoPrep:estadoPrep, marcaPrep:marcaPrep
  };
}

<script>
(function(){

  mar:{desayuno:'D1', almuerzo:'',    cena:'C50', guarnicion:'', fuera:true},

function hoyKey(){

try{

  if(raw){
    var migrado = aplicar(JSON.parse(raw));
    /* Tras migrar se guarda de inmediato, conservando las marcas antiguas en comprasLegado. */
    if(migrado) localStorage.setItem('recetario.menu', JSON.stringify(cuerpo()));
  }
}catch(e){}
function subir(){
  if(!dbRef) return;
  marcaSync('sincronizando');
  dbRef.set(cuerpo()).then(function(){ marcaSync('sincronizado'); })
    .catch(function(){ marcaSync('error'); });
}
function guardar(){
  try{ localStorage.setItem('recetario.menu', JSON.stringify(cuerpo())); localOk = true; }
  catch(e){ localOk = false; }
  if(!dbRef){ marcaSync('local'); return; }
  marcaSync('pendiente');
  clearTimeout(tmr);
  tmr = setTimeout(subir, 500);
}
if(window.claude && window.claude.use){
  S.sync = 'conectando';
  window.claude.use('db').then(function(db){
    if(!db){ marcaSync('local'); return; }
    dbRef = db.doc('menu/actual');
    var primera = true;
    dbRef.onSnapshot(function(sn){
      if(sn.metadata && sn.metadata.hasPendingWrites) return;
      if(!sn.exists){
        /* La copia compartida aún no existe: se sube la local. */
        if(primera){ primera = false; subir(); }
        return;
      }
      primera = false;
      var d2 = sn.data();
      if(!d2) return;
      var migrado = aplicar(d2);
      try{ localStorage.setItem('recetario.menu', JSON.stringify(cuerpo())); localOk = true; }catch(e){ localOk = false; }
      var sel = document.getElementById('comensales');
      if(sel) sel.value = String(S.comensales);
      var fs = document.getElementById('fase');
      if(fs) fs.value = String(S.fase);
      if(migrado) subir(); else marcaSync('sincronizado');
      render();
    }, function(){ marcaSync('error'); });
  }).catch(function(){ marcaSync('local'); });
}

/* ---------- utilidades ---------- */
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function redondear(v){
  if(Math.abs(v - Math.round(v)) < 0.01) return Math.round(v);
  return v >= 10 ? Math.round(v) : Math.round(v*10)/10;
}
function plu(u, v){
  if(v === 1) return u;
  if(u === 'unidad') return 'unidades';
  if(u === 'hoja') return 'hojas';
  if(u === 'vainas' && v === 1) return 'vaina';
  return u;
}
function fmtQ(v, u){ var r = redondear(v); return String(r).replace('.', ',') + ' ' + plu(u, r); }
function nCant(n, u){ return fmtQ(n * S.comensales, u); }
function num(v){ return String(redondear(v)).replace('.', ','); }
function signo(v){ var r = Math.round(v); return (r > 0 ? '+' : (r < 0 ? '−' : '±')) + Math.abs(r); }
function pct(v, max){ return Math.max(0, Math.min(100, (v / max) * 100)); }
function cocinaTxt(c){ return c === SIN_COCINA ? '' : c; }
function prepNombre(pid){ var p = M.preps[pid]; return p ? (p.corto || p.nombre.toLowerCase()) : pid; }
function nombreDia(k){ var d = diaDe(k); return d ? d.n : k; }
function obj(){ return M.objetivos(S.fase); }
function planActual(){ return M.plan(S.semana, S.comensales); }
var EST_CLASE = {ok:'ok', margen:'warn', aviso:'bad'};

function textoEstado(ev, o){
  if(ev.estado === 'ok') return 'Dentro del objetivo.';
  var u = M.umbrales(o);
  if(ev.estado === 'margen')
    return 'Fuera del objetivo, dentro del margen de aviso (' + (ev.lado === 'bajo' ? 'avisa por debajo de ' + num(u.bajo) : 'avisa por encima de ' + num(u.alto)) + ' ' + o.unidad + ').';
  return 'Aviso: ' + (ev.lado === 'bajo' ? 'por debajo' : 'por encima') + ' del objetivo' +
    ((ev.lado === 'bajo' ? o.tol.definidaBajo : o.tol.definidaAlto) ? ' y de su margen.' : '.');
}
function barra(o, val, nota, falta){
  var ev = M.evaluar(val, o), est = EST_CLASE[ev.estado], max = o.hi * 1.25;
  return '<div class="bar">' +
    '<div class="lab"><span>' + esc(o.nombre) + '</span>' +
    '<b>' + num(val) + (falta ? '<sup title="' + esc(falta) + '">*</sup>' : '') + ' <i>/ ' + o.lo + '–' + o.hi + ' ' + esc(o.unidad) + '</i></b></div>' +
    '<div class="track"><div class="fill ' + est + '" style="width:' + pct(val, max).toFixed(1) + '%"></div>' +
    '<div class="goal" style="left:' + pct(o.lo, max).toFixed(1) + '%"></div>' +
    '<div class="goal" style="left:' + pct(o.hi, max).toFixed(1) + '%"></div></div>' +
    '<div class="note est-' + est + '">' + esc(textoEstado(ev, o)) + (falta ? ' * ' + esc(falta) + '.' : '') + '</div>' +
    (nota ? '<div class="note">' + esc(nota) + '</div>' : '') + '</div>';
}
function alertas(arr, vacioTxt){
  if(!arr.length) return '<div class="alert ok"><span class="tag">Conforme</span><span>' + esc(vacioTxt) + '</span></div>';
  return arr.map(function(p){
    return '<div class="alert ' + p.t + '"><span class="tag">' + esc(p.tag) + '</span><span>' + esc(p.m) + '</span></div>';
  }).join('');
}
function chipsPrep(r){

function sugerirGuarn(k){

    if(d.vent && !r.apto_ventana_contencion) return false;
    if((c[r.id] || 0) >= O.repMax) return false;

/* ---------- volumen ---------- */
var FR = [[0.25,'1/4'],[1/3,'1/3'],[0.5,'1/2'],[2/3,'2/3'],[0.75,'3/4']];
function snapF(v){
  var e = Math.floor(v + 1e-9), f = v - e;
  if(f < 0.125) return e;
  if(f > 0.875) return e + 1;
  var b = FR[0];
  for(var i=1;i<FR.length;i++){ if(Math.abs(FR[i][0]-f) < Math.abs(b[0]-f)) b = FR[i]; }
  return e + b[0];
}
function fraseV(v, sing, plur){
  var ent = Math.floor(v + 1e-6), fr = v - ent, ft = null;
  for(var i=0;i<FR.length;i++){ if(Math.abs(fr - FR[i][0]) < 0.02){ ft = FR[i][1]; break; } }
  if(ent === 0 && ft) return ft === '1/2' ? ('1/2 ' + sing) : (ft + ' de ' + sing);
  if(!ft) return ent + ' ' + (ent === 1 ? sing : plur);
  return ent + ' ' + ft + ' ' + plur;
}
function fmtVol(ml, fino){
  if(!ml || ml <= 0) return null;
  if(ml >= (fino ? 60 : 115)){
    var v = ml / 240;
    v = v >= 3 ? Math.round(v*2)/2 : snapF(v);
    if(v < 0.25) v = 0.25;
    return fraseV(v, 'taza', 'tazas');
  }
  if(ml >= 14) return fraseV(snapF(ml/15), 'cucharada', 'cucharadas');
  var t = snapF(ml/5);
  if(t < 0.25) return 'menos de 1/4 de cucharadita';
  return fraseV(t, 'cucharadita', 'cucharaditas');
}
function volDe(i, escala){
  var k = escala || 1, pz = null;
  if(i.eq && i.unidad === 'g'){
    var n = i.cantidad * k / i.eq.g, nr = Math.round(n);
    if(nr >= 1 && Math.abs(n - nr) < 0.34) pz = nr + ' ' + (nr === 1 ? i.eq.sing : i.eq.plur);
  }
  if(!i.vol_ml) return pz;
  var t = fmtVol(i.vol_ml * k, /^(agua|caldo)\b/i.test(i.item));
  if(t && pz) t += ', ' + pz;
  return t || pz;
}

var focoPrevio = null;
function abrirSwap(diaK, comida){
  focoPrevio = document.activeElement;
  S.swap = {dia:diaK, comida:comida, sel:null};
  pintarSwap();
}
function cerrarSwap(){
  S.swap = null;

function semanaCon(dia, comida, id){
  var sem = M.copia(S.semana);
  if(!sem[dia]) sem[dia] = vacio();
  if(id === '__fuera__'){ sem[dia].fuera = true; sem[dia].almuerzo = ''; }
  else { sem[dia][comida] = id; if(comida === 'almuerzo') sem[dia].fuera = false; }
  return sem;
}
function scoreSwap(r, dia, comida, actual, c, tDia, O){
  var n = 0;
  if(dia.vent && !r.apto_ventana_contencion) n += 100;
  if(M.cuentaRepeticion(r) && (c[r.id] || 0) >= O.repMax && r.id !== actual) n += 50;
  if(r.aporta_omega3_marino && M.omega(S.semana) < O.omega.lo) n -= 10;
  if(comida === 'guarnicion'){
    if(tDia.kcBase + r.macros.kcal_aprox > O.kcal.hi) n += 50;
    else n -= Math.max(0, 10 - Math.abs(tDia.kcBase + r.macros.kcal_aprox - (O.kcal.lo + O.kcal.hi) / 2) / 20);
  }
  return n;
}
function pintarSwap(foco){

    var d0 = scoreSwap(a, dia, comida, actual, c, tDia, O) - scoreSwap(b, dia, comida, actual, c, tDia, O);
    return d0 ? d0 : a.nombre.localeCompare(b.nombre, 'es');
  });
  var compat = cands.filter(function(r){ return scoreSwap(r, dia, comida, actual, c, tDia, O) < 50; });
  var no = cands.filter(function(r){ return scoreSwap(r, dia, comida, actual, c, tDia, O) >= 50; });
  var nomC = M.NOMBRE_COMIDA[comida].toLowerCase();
  var h = '<div class="scrim" data-cerrar="1"></div>';
  h += '<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-t">';
  h += '<div class="drawer-h"><div><h2 id="dr-t">Cambiar ' + nomC + '</h2><div class="s">' + dia.n +

    '<button class="btn gh" data-cerrar="1">Cerrar</button></div><div class="drawer-b">';
  h += '<p class="drawer-nota">Elige una opción para ver su efecto antes de confirmarla. La lista se ordena por ventana de viernes a domingo, ' +
    'tope de ' + O.repMax + ' repeticiones' + (comida === 'guarnicion' ? ', techo de energía del día' : '') + ' y pescado marino pendiente. ' +
    'Los totales y las alertas completas aparecen al elegir.</p>';
  if(comida === 'almuerzo') h += opcion('__fuera__', 'Almuerzo fuera de casa', FUERA.proteina_g + ' g prot · ' + FUERA.fibra_g + ' g fibra · ' + FUERA.kcal_aprox + ' kcal estimadas', s.fuera, '');
  if(comida === 'guarnicion') h += '<div class="drawer-sec">El día cierra en ' + num(tDia.kcBase) + ' kcal sin guarnición. Techo: ' + O.kcal.hi + ' kcal.</div>';
  h += opcion('', comida === 'guarnicion' ? 'Sin guarnición' : 'Dejar sin asignar', '', !actual && !(comida === 'almuerzo' && s.fuera), '');
  h += '<div class="drawer-sec">Sin conflicto de ventana ni repetición · ' + compat.length + '</div>';
  compat.forEach(function(r){ h += optHTML(r, dia, c, actual, false, comida === 'guarnicion' ? tDia : null, O); });
  if(no.length){
    h += '<div class="drawer-sec">Con conflictos · ' + no.length + '</div>';
    no.forEach(function(r){ h += optHTML(r, dia, c, actual, true, comida === 'guarnicion' ? tDia : null, O); });
  }
  h += '</div></aside>';
  var layer = document.getElementById('layer');
  var prevScroll = layer.querySelector('.drawer-b') ? layer.querySelector('.drawer-b').scrollTop : 0;
  layer.innerHTML = h;
  document.body.style.overflow = 'hidden';
  var db = layer.querySelector('.drawer-b');
  if(foco && db) db.scrollTop = prevScroll;
  var f = foco ? layer.querySelector(foco) : layer.querySelector('.opt');
  if(f){ f.focus(); if(foco && f.scrollIntoView) f.scrollIntoView({block:'nearest'}); }
}
function opcion(id, titulo, meta, actual, badges){
  var sel = S.swap.sel === id;
  return '<button class="opt" data-pre="' + esc(id) + '" aria-expanded="' + sel + '"' + (actual ? ' aria-current="true"' : '') + '>' +
    '<span class="t"><b>' + esc(titulo) + '</b>' + (actual ? '<span class="chip-s">actual</span>' : '') + '</span>' +
    (meta ? '<span class="m">' + meta + '</span>' : '') + (badges ? '<span class="badges">' + badges + '</span>' : '') + '</button>' +
    (sel ? previa(id) : '');
}
function optHTML(r, dia, c, actual, no, tDia, O){
  var b = [];
  if(r.categoria === 'guarnicion' && tDia){
    var cierre = tDia.kcBase + r.macros.kcal_aprox;
    b.push('<span class="chip-s ' + (cierre > O.kcal.hi ? 'bad' : (cierre >= O.kcal.lo ? 'ok' : '')) +
      '">Cierra el día en ' + num(cierre) + ' kcal</span>');
  }
  if(dia.vent && !r.apto_ventana_contencion) b.push('<span class="chip-s bad">No apta de viernes a domingo</span>');
  if(r.aporta_omega3_marino) b.push('<span class="chip-s ok">Pescado marino</span>');
  if(M.cuentaRepeticion(r) && (c[r.id] || 0) >= O.repMax && r.id !== actual) b.push('<span class="chip-s bad">Ya está ' + O.repMax + ' veces</span>');
  else if(c[r.id]) b.push('<span class="chip-s">En la semana ×' + c[r.id] + '</span>');
  var t = M.tiempo(r);
  if(t.antelacion) b.push('<span class="chip-s warn">Empezar ' + esc(t.antelacion) + '</span>');
  (r.requiere || []).forEach(function(pid){ b.push('<span class="chip-s">Necesita ' + esc(prepNombre(pid)) + '</span>'); });
  var ct = cocinaTxt(r.cocina);
  var h = opcion(r.id, r.nombre, (ct ? esc(ct) + ' · ' : '') + r.macros.kcal_aprox + ' kcal · ' + r.macros.proteina_g +
    ' g prot · ' + r.macros.fibra_g + ' g fibra · ' + esc(M.textoTiempo(r)), actual === r.id, b.join(''));
  return no ? h.replace('class="opt"', 'class="opt no"') : h;
}
/* Vista previa del cambio: totales del día, alertas resultantes, tiempo, preparaciones y efecto en la semana. */
function previa(id){
  var sw = S.swap, O = obj(), dk = sw.dia, comida = sw.comida;
  var sem2 = semanaCon(dk, comida, id);
  var t0 = M.totalesDia(S.semana, dk), E1 = M.evaluarDia(sem2, dk, S.fase), t1 = E1.t;
  var h = '<div class="preview" role="region" aria-label="Efecto del cambio">';
  h += '<div class="pv-t">Si eliges esta opción</div><div class="pv-grid">';
  function fila(lab, a, b, ev, u){
    var d = b - a;
    return '<div class="pv-r ' + EST_CLASE[ev.estado] + '"><span>' + lab + '</span><b>' + num(b) + ' ' + u + '</b><i>' + (Math.abs(d) < 0.5 ? 'sin cambio' : signo(d) + ' ' + u) + '</i></div>';
  }
  h += fila('Proteína', t0.p, t1.p, E1.prot, 'g') + fila('Fibra', t0.f, t1.f, E1.fib, 'g') + fila('Energía', t0.kc, t1.kc, E1.kcal, 'kcal');
  h += '</div>';
  var antes = M.problemasDia(S.semana, dk, S.fase).map(function(p){ return p.tag + '|' + p.m; });
  var desp = M.problemasDia(sem2, dk, S.fase);
  h += '<div class="pv-s">Alertas del día con este cambio</div>';
  if(!desp.length) h += '<p class="pv-ok">Ninguna: el día quedaría dentro de las reglas de proteína, fibra, energía, ventana y repetición.</p>';
  else h += '<ul class="pv-al">' + desp.map(function(p){
    return '<li class="' + p.t + '"><b>' + esc(p.tag) + '</b> ' + esc(p.m) + (antes.indexOf(p.tag + '|' + p.m) < 0 ? ' <em>nueva</em>' : '') + '</li>'; }).join('') + '</ul>';
  var r = byId[id];
  if(r){
    var t = M.tiempo(r);
    h += '<div class="pv-s">Tiempo</div><p>Cocina ' + M.fmtMin(t.cocina) +
      (t.espera || t.motivo ? ' · espera ' + (t.espera ? M.fmtMin(t.espera) : 'una noche') + ' de ' + esc(t.motivo) + ' · total ' + (t.total != null ? M.fmtMin(t.total) : 'desde la víspera') : '') + '.' +
      (t.antelacion ? ' <b class="c-warn">No está disponible de inmediato: hay que empezarla ' + esc(t.antelacion) + '.</b>' : '') + '</p>';
    if(r.requiere && r.requiere.length){
      var pl2 = M.plan(sem2, S.comensales), sp = M.semanaPrep(new Date());
      h += '<div class="pv-s">Preparaciones previas</div><ul class="plain">' + r.requiere.map(function(pid){
        var e = M.estadoPrep(pl2.preps[pid], S.prep[pid], sp);
        return '<li>' + esc(M.preps[pid] ? M.preps[pid].nombre : pid) + ': ' +
          (e.s === 'lista' ? 'lista para esta semana' : (e.s === 'parcial' ? 'lista para una cantidad menor; hay que preparar más' : 'pendiente de preparar')) + '</li>';
      }).join('') + '</ul>';
    }
    var c2 = M.usos(sem2), om0 = M.omega(S.semana), om1 = M.omega(sem2);
    h += '<div class="pv-s">Semana</div><p>' + (M.cuentaRepeticion(r) ?
      'Este plato quedaría ' + c2[r.id] + (c2[r.id] === 1 ? ' vez' : ' veces') + ' en la semana (tope ' + O.repMax + '). ' :
      'Los desayunos no cuentan para el tope de repetición. ') +
      'Pescado marino: ' + om1 + ' en la semana' + (om1 !== om0 ? ' (antes ' + om0 + ')' : '') + ', rango ' + O.omega.lo + '–' + O.omega.hi + '.</p>';
  } else {
    var om0b = M.omega(S.semana), om1b = M.omega(sem2);
    if(om0b !== om1b) h += '<div class="pv-s">Semana</div><p>Pescado marino: ' + om1b + ' en la semana (antes ' + om0b + '), rango ' + O.omega.lo + '–' + O.omega.hi + '.</p>';
  }
  if(t1.est.length) h += '<p class="mini">Estimado: ' + esc(t1.est.join('; ')) + '.</p>';
  h += '<div class="pv-acts"><button class="btn pri" data-set="' + dk + '|' + comida + '|' + esc(id) + '">Confirmar cambio</button>' +
    '<button class="btn gh" data-pre="' + esc(id) + '">Cancelar</button></div>';
  return h + '</div>';
}

/* ================= RENDER ================= */
function render(){
  var coc = {};
  R.forEach(function(x){ coc[x.cocina] = 1; });
  document.getElementById('sub').textContent = R.length + ' recetas · ' + Object.keys(coc).length + ' cocinas · versión ' + D.meta.version;
  var m = document.getElementById('main');
  if(S.vista === 'inicio') m.innerHTML = vInicio();
  else if(S.vista === 'semana') m.innerHTML = vSemana();
  else if(S.vista === 'recetas') m.innerHTML = vRecetas();
  else if(S.vista === 'compras') m.innerHTML = vCompras();
  else if(S.vista === 'prep') m.innerHTML = vPrep();
  else m.innerHTML = vReglas();
  Array.prototype.forEach.call(document.querySelectorAll('nav.main button'), function(b){
    b.setAttribute('aria-selected', String(b.dataset.v === S.vista));
  });
  pintarSync();
  altoCabecera();
}
function ir(v, sinScroll){ S.vista = v; render(); if(!sinScroll) window.scrollTo({top:0, behavior:'smooth'}); }
function altoCabecera(){
  var t = document.querySelector('.top'), ti = document.querySelector('.top-in'), n = document.querySelector('nav.main');
  if(!t) return;
  var st = document.documentElement.style;
  st.setProperty('--top-in-h', ti.offsetHeight + 'px');
  /* En móvil solo queda fija la navegación: la parte superior se desplaza con la página. */
  var movil = window.matchMedia && window.matchMedia('(max-width:560px)').matches;
  st.setProperty('--top-h', (movil ? n.offsetHeight : t.offsetHeight) + 'px');
}
window.addEventListener('resize', altoCabecera);
function verReceta(id){
  /* Si los filtros ocultan la receta pedida, se quitan para poder mostrarla. */
  if(!M.filtrar(S.filtro).some(function(r){ return r.id === id; })) S.filtro = {cat:'', q:'', rapido:false, vent:false, omega:false, cocina:''};
  S.abierta = id;
  ir('recetas');
}
function irPrep(pid){
  ir('prep', true);
  var el = document.getElementById('prep-' + pid);
  if(el){ el.scrollIntoView({block:'start'}); el.setAttribute('tabindex', '-1'); el.focus({preventScroll:true}); }
}
function marcar(clave, s){
  var pl = planActual(), l = pl.porClave[clave];
  if(!l) return;
  var e = M.estadoMarca(l, S.compras);
  if(e.s === s && !e.parcial) delete S.compras[clave];
  else S.compras[clave] = {s:s, q:l.cant};
  guardar(); render();
}

/* ================= EVENTOS ================= */
document.querySelector('nav.main').addEventListener('click', function(e){
  var b = e.target.closest('button[data-v]');
  if(b) ir(b.dataset.v);
});
document.getElementById('comensales').addEventListener('change', function(e){
  S.comensales = parseInt(e.target.value, 10) || 1; guardar(); render();
});
document.getElementById('fase').addEventListener('change', function(e){
  S.fase = e.target.value === '2' ? 2 : 1; guardar(); render();
});
document.getElementById('layer').addEventListener('click', function(e){
  if(e.target.closest('[data-cerrar]')){ cerrarSwap(); render(); return; }
  var pv = e.target.closest('[data-pre]');
  if(pv){
    var id = pv.dataset.pre;
    S.swap.sel = S.swap.sel === id ? null : id;
    pintarSwap(S.swap.sel !== null ? '.preview [data-set]' : '[data-pre="' + id.replace(/"/g, '') + '"]');
    return;
  }
  var b = e.target.closest('[data-set]');
  if(!b) return;
  var p = b.dataset.set.split('|');
  S.semana = semanaCon(p[0], p[1], p[2]);
  guardar(); cerrarSwap(); render();
});
document.addEventListener('keydown', function(e){
  if(!S.swap) return;
  if(e.key === 'Escape'){ cerrarSwap(); render(); return; }
  if(e.key === 'Tab'){
    /* El foco no sale del panel mientras está abierto. */
    var f = document.querySelectorAll('.drawer button, .drawer [href], .drawer select, .drawer input');
    if(!f.length) return;
    var a = f[0], z = f[f.length - 1];
    if(e.shiftKey && document.activeElement === a){ z.focus(); e.preventDefault(); }
    else if(!e.shiftKey && document.activeElement === z){ a.focus(); e.preventDefault(); }
  }
});
document.getElementById('main').addEventListener('click', function(e){
  var t;
  if((t = e.target.closest('[data-swap]'))){ var p = t.dataset.swap.split('|'); abrirSwap(p[0], p[1]); return; }
  if((t = e.target.closest('[data-poner]'))){
    var pp = t.dataset.poner.split('|');
    S.semana = semanaCon(pp[0], 'guarnicion', pp[1]);
    guardar(); render(); return;
  }
  if((t = e.target.closest('[data-quitar]'))){
    var kq = t.dataset.quitar;
    if(S.semana[kq]) S.semana[kq].guarnicion = '';
    guardar(); render(); return;
  }
  if((t = e.target.closest('[data-ver]'))){ verReceta(t.dataset.ver); return; }
  if((t = e.target.closest('[data-prepver]'))){ irPrep(t.dataset.prepver); return; }
  if((t = e.target.closest('[data-goto]'))){ ir(t.dataset.goto); return; }
  if((t = e.target.closest('[data-dia]'))){ S.diaSel = t.dataset.dia; render(); return; }
  if((t = e.target.closest('[data-abrir]'))){
    S.abierta = t.dataset.abrir; render();
    var fi = document.getElementById('ficha');
    if(fi && window.matchMedia && window.matchMedia('(max-width:940px)').matches) fi.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  if((t = e.target.closest('[data-cat]'))){ S.filtro.cat = t.dataset.cat; render(); return; }
  if((t = e.target.closest('[data-cv]'))){ S.comprasVista = t.dataset.cv; render(); return; }
  if((t = e.target.closest('[data-buy]'))){ marcar(t.dataset.buy, 'c'); return; }
  if((t = e.target.closest('[data-tengo]'))){ marcar(t.dataset.tengo, 't'); return; }
  if((t = e.target.closest('[data-prepok]'))){
    var q = t.dataset.prepok.split('|'), plq = planActual();
    if(q[1] === '1' && plq.preps[q[0]]) S.prep[q[0]] = M.marcaPrep(plq.preps[q[0]], M.semanaPrep(new Date()));
    else delete S.prep[q[0]];
    guardar(); render();
    var bt = document.querySelector('[data-prepok^="' + q[0] + '|"]');
    if(bt) bt.focus({preventScroll:true});
    return;
  }
  if((t = e.target.closest('[data-cat-all]'))){
    var pl = planActual();
    var items = pl.lineas.filter(function(l){ return l.seccion === t.dataset.catAll; });
    var todos = items.length && items.every(function(l){ var es = M.estadoMarca(l, S.compras); return es.s && !es.parcial; });
    items.forEach(function(l){
      if(todos) delete S.compras[l.clave];
      else { var es = M.estadoMarca(l, S.compras); if(!es.s || es.parcial) S.compras[l.clave] = {s:'c', q:l.cant}; }
    });
    guardar(); render(); return;
  }
  if((t = e.target.closest('[data-asig]'))){
    var qa = t.dataset.asig.split('|'), r = byId[qa[0]];
    S.semana = semanaCon(qa[1], r.categoria, r.id);
    guardar(); S.diaSel = qa[1]; ir('semana'); return;
  }
  if((t = e.target.closest('[data-accion]'))){
    var a = t.dataset.accion;
    if(a === 'semilla'){ S.semana = M.normalizarSemana(SEMILLA); guardar(); render(); }
    if(a === 'vaciar'){
      DIAS.forEach(function(d){ S.semana[d.k] = vacio(); });
      guardar(); render();
    }
    if(a === 'limpiar'){
      if(window.confirm && !window.confirm('¿Quitar todas las marcas de «Comprado» y «Ya tengo»?')) return;
      S.compras = {}; S.comprasLegado = {}; guardar(); render();
    }
    if(a === 'copiar'){
      var fin = function(ok){
        var el = document.getElementById('copiado');
        if(el) el.textContent = ok ? 'Copiado al portapapeles' : 'No se pudo copiar';
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(textoSemana()).then(function(){ fin(true); }, function(){ fin(false); });
      } else fin(false);
    }
    return;
  }
});
document.getElementById('main').addEventListener('input', function(e){
  if(e.target.id === 'q'){
    S.filtro.q = e.target.value;
    var pos = e.target.selectionStart;
    render();
    var n = document.getElementById('q');
    if(n){ n.focus(); n.setSelectionRange(pos, pos); }
  }
});
document.getElementById('main').addEventListener('change', function(e){
  var t;
  if(e.target.id === 'cocina'){ S.filtro.cocina = e.target.value; render(); return; }
  if((t = e.target.closest('[data-tog]'))){ S.filtro[t.dataset.tog] = t.checked; render(); return; }
  if((t = e.target.closest('[data-dulce]'))){
    var kd = t.dataset.dulce;
    S.semana[kd].dulce = t.value;
    guardar(); render();
    var sel = document.querySelector('[data-dulce="' + kd + '"]');
    if(sel) sel.focus({preventScroll:true});
    return;
  }
  if((t = e.target.closest('[data-fuera]'))){
    var k = t.dataset.fuera;
    if(!S.semana[k]) S.semana[k] = vacio();
    S.semana[k].fuera = t.checked;
    if(t.checked) S.semana[k].almuerzo = '';
    guardar(); render(); return;
  }
});

document.getElementById('comensales').value = String(S.comensales);
document.getElementById('fase').value = String(S.fase);
render();
})();
</script>

</body></html>
